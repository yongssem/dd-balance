<style>
  /* 뚝딱 파스텔 디자인 토큰 */
  :root {
    --dd-bg: #FFF8F0;          /* 크림 배경 */
    --dd-coral: #FF9A8B;       /* 주요 강조 (코랄) */
    --dd-coral-deep: #FF6B6B;  /* hover 코랄 딥 */
    --dd-mint: #A8E6CF;        /* 보조 강조 (민트) */
    --dd-text: #2D3748;        /* 기본 텍스트 */
    --dd-text-sub: #64748B;    /* 보조 텍스트 */
    --dd-border: #FFE5DC;      /* 테두리 */
    --dd-white: #FFFFFF;
    --dd-radius: 20px;
    --dd-shadow: 0 4px 16px rgba(255, 154, 139, 0.12);
    --dd-shadow-lg: 0 8px 24px rgba(255, 107, 107, 0.2);
  }

  * { -webkit-tap-highlight-color: transparent; }

  html, body {
    background-color: var(--dd-bg);
    color: var(--dd-text);
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-feature-settings: 'ss01', 'ss02';
    -webkit-font-smoothing: antialiased;
  }

  /* 기본 카드 */
  .dd-card {
    background: var(--dd-white);
    border: 1px solid var(--dd-border);
    border-radius: var(--dd-radius);
    box-shadow: var(--dd-shadow);
  }

  /* 주요 버튼 (코랄) */
  .dd-btn-primary {
    background: var(--dd-coral);
    color: var(--dd-white);
    border-radius: var(--dd-radius);
    font-weight: 700;
    transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    will-change: transform;
  }
  .dd-btn-primary:hover { background: var(--dd-coral-deep); box-shadow: var(--dd-shadow-lg); }
  .dd-btn-primary:active { transform: scale(0.97); }

  /* 보조 버튼 (민트) */
  .dd-btn-secondary {
    background: var(--dd-mint);
    color: var(--dd-text);
    border-radius: var(--dd-radius);
    font-weight: 600;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .dd-btn-secondary:hover { opacity: 0.85; }
  .dd-btn-secondary:active { transform: scale(0.97); }

  /* 고스트 버튼 */
  .dd-btn-ghost {
    background: transparent;
    color: var(--dd-text-sub);
    border: 1px solid var(--dd-border);
    border-radius: 12px;
    transition: background-color 0.15s ease;
  }
  .dd-btn-ghost:hover { background: var(--dd-border); }

  /* 로고 뱃지 */
  .dd-logo-badge {
    background: linear-gradient(135deg, var(--dd-coral) 0%, var(--dd-coral-deep) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* 페이지 전환 애니메이션 (GPU 가속) */
  .dd-fade-in {
    animation: ddFadeIn 0.25s ease-out;
  }
  @keyframes ddFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 빈 상태 일러스트 박스 */
  .dd-empty {
    border: 2px dashed var(--dd-border);
    border-radius: var(--dd-radius);
    color: var(--dd-text-sub);
  }

  /* 푸터 링크 hover */
  footer a:hover { color: var(--dd-coral-deep) !important; }

  /* 투표 카드 */
  .dd-vs-card {
    background: var(--dd-white);
    border: 2px solid var(--dd-border);
    border-radius: var(--dd-radius);
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, opacity 0.25s ease;
    will-change: transform, opacity;
    width: 100%;
  }
  .dd-vs-card:hover { border-color: var(--dd-coral); box-shadow: var(--dd-shadow); }
  .dd-vs-card:active { transform: scale(0.97); }
  .dd-vs-card.is-picked {
    border-color: var(--dd-coral-deep);
    box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.15), var(--dd-shadow-lg);
    transform: scale(1.03);
  }
  .dd-vs-card.is-lost { opacity: 0.25; transform: scale(0.95); }

  .dd-vs-emoji { font-size: 64px; line-height: 1.1; }
  @media (min-width: 480px) { .dd-vs-emoji { font-size: 80px; } }

  .dd-vs-text {
    margin-top: 12px;
    font-weight: 700;
    font-size: 18px;
    color: var(--dd-text);
    word-break: keep-all;
  }

  /* VS 뱃지 */
  .dd-vs-badge {
    font-weight: 900;
    font-size: 14px;
    color: var(--dd-coral-deep);
    background: var(--dd-white);
    border: 2px solid var(--dd-coral);
    padding: 6px 14px;
    border-radius: 999px;
    letter-spacing: 1px;
  }

  /* 진행 바 */
  .dd-progress-track {
    background: var(--dd-border);
    border-radius: 999px;
    height: 6px;
    overflow: hidden;
  }
  .dd-progress-fill {
    background: linear-gradient(90deg, var(--dd-coral) 0%, var(--dd-coral-deep) 100%);
    height: 100%;
    transition: width 0.3s ease;
  }

  /* 라운드 전환 애니메이션 */
  .dd-round-enter { animation: ddRoundEnter 0.35s ease-out; }
  @keyframes ddRoundEnter {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 챔피언 카드 */
  .dd-champion-card {
    position: relative;
    background: linear-gradient(135deg, #FFF0D6 0%, #FFE5DC 50%, #FFD6C7 100%);
    border: 2px solid var(--dd-coral);
    border-radius: 28px;
    padding: 32px 20px;
    text-align: center;
    box-shadow: var(--dd-shadow-lg);
    overflow: hidden;
  }
  .dd-champion-card::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.7) 0%, transparent 60%);
    pointer-events: none;
  }
  .dd-champion-emoji {
    font-size: 96px;
    line-height: 1;
    animation: ddChampPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes ddChampPop {
    0%   { transform: scale(0.3); opacity: 0; }
    60%  { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }
  .dd-champion-ribbon {
    display: inline-block;
    background: var(--dd-coral-deep);
    color: var(--dd-white);
    padding: 4px 14px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  /* 대진표 라운드 */
  .dd-round-card {
    background: var(--dd-white);
    border: 1px solid var(--dd-border);
    border-radius: var(--dd-radius);
    padding: 14px 14px 10px;
    margin-bottom: 12px;
  }
  .dd-round-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .dd-round-title {
    font-weight: 800; color: var(--dd-text);
    font-size: 14px;
  }
  .dd-round-title .dd-round-emoji { margin-right: 6px; }

  .dd-match-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; margin-bottom: 6px;
    background: var(--dd-bg);
    border-radius: 12px;
  }
  .dd-match-side {
    flex: 1; display: flex; align-items: center; gap: 8px;
    min-width: 0;
  }
  .dd-match-side .name {
    font-size: 13px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dd-match-side .ico { font-size: 20px; line-height: 1; flex-shrink: 0; }
  .dd-match-side.loser .name { color: var(--dd-text-sub); text-decoration: line-through; }
  .dd-match-side.winner .name { color: var(--dd-coral-deep); }
  .dd-match-vs {
    font-size: 10px; font-weight: 900; color: var(--dd-text-sub);
    letter-spacing: 1px;
  }

  /* 모달 */
  .dd-modal {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .dd-modal-backdrop {
    position: absolute; inset: 0;
    background: rgba(45, 55, 72, 0.55);
    animation: ddFadeIn 0.2s ease-out;
  }
  .dd-modal-body {
    position: relative;
    background: var(--dd-white);
    border-radius: 24px;
    padding: 24px 20px;
    max-width: 340px; width: 100%;
    text-align: center;
    box-shadow: var(--dd-shadow-lg);
    animation: ddModalIn 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes ddModalIn {
    from { opacity: 0; transform: scale(0.88); }
    to   { opacity: 1; transform: scale(1); }
  }
  .dd-modal-body canvas { margin: 12px auto; display: block; border-radius: 12px; }
  .dd-qr-url {
    font-size: 11px; color: var(--dd-text-sub);
    word-break: break-all;
    background: var(--dd-bg); padding: 8px 10px;
    border-radius: 10px; margin: 10px 0 14px;
    text-align: left;
  }

  /* 우승 경로 리스트 */
  .dd-path-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 4px;
  }
  .dd-path-row + .dd-path-row { border-top: 1px dashed var(--dd-border); }
  .dd-path-stage {
    width: 48px; text-align: center;
    font-size: 11px; font-weight: 800;
    color: var(--dd-coral-deep);
    background: var(--dd-bg);
    border-radius: 8px; padding: 4px 0;
    flex-shrink: 0;
  }
  .dd-path-vs { color: var(--dd-text-sub); font-size: 12px; }
</style>

<script type="module">
  /* ===========================================================
   * 🔑 storage 객체 (localStorage 격리 계층)
   * - UI/로직 코드는 절대 localStorage 직접 호출 금지
   * - L3 전환 시 이 객체 내부만 Firestore로 교체
   * =========================================================== */
  const STORAGE_KEY = 'ddalkak-balance-v1';

  const defaultState = () => ({
    tournaments: {}, // [id]: { id, title, type, items, createdAt }
    votes: {},       // [tournamentId]: { rounds, champion, completedAt }
    results: {},     // [tournamentId]: { submissions: [...] }
  });

  // 내부: 전체 상태 읽기
  function readState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      // 필수 키 보정 (스키마 진화 대비)
      return {
        tournaments: parsed.tournaments || {},
        votes: parsed.votes || {},
        results: parsed.results || {},
      };
    } catch (e) {
      console.warn('[storage] 상태 읽기 실패, 초기화:', e);
      return defaultState();
    }
  }

  // 내부: 전체 상태 쓰기
  function writeState(state) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return true;
    } catch (e) {
      console.error('[storage] 저장 실패:', e);
      return false;
    }
  }

  // 🔑 storage API — 외부 코드는 오직 이 객체를 통해서만 접근
  const storage = {
    // 토너먼트 단건 조회
    getTournament(id) {
      const state = readState();
      return state.tournaments[id] || null;
    },

    // 토너먼트 저장 (신규 + 수정 겸용)
    saveTournament(tournament) {
      if (!tournament || !tournament.id) {
        throw new Error('[storage] tournament.id 필수');
      }
      const state = readState();
      state.tournaments[tournament.id] = tournament;
      return writeState(state);
    },

    // 내가 만든 토너먼트 목록 (최신순)
    listMyTournaments() {
      const state = readState();
      return Object.values(state.tournaments)
        .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    },

    // 토너먼트 삭제 (관련 votes/results 함께 정리)
    deleteTournament(id) {
      const state = readState();
      delete state.tournaments[id];
      delete state.votes[id];
      delete state.results[id];
      return writeState(state);
    },

    // 투표 결과 조회 (완료된 토너먼트)
    getVotes(tournamentId) {
      const state = readState();
      return state.votes[tournamentId] || null;
    },

    // 투표 결과 저장 (rounds/champion/completedAt)
    saveVotes(tournamentId, votes) {
      if (!tournamentId) throw new Error('[storage] tournamentId 필수');
      const state = readState();
      state.votes[tournamentId] = votes;
      return writeState(state);
    },

    // 전체 백업 (JSON 문자열)
    exportBackup() {
      const state = readState();
      return JSON.stringify(state, null, 2);
    },

    // 백업 복구 (JSON 문자열 받아서 덮어쓰기)
    importBackup(json) {
      try {
        const parsed = JSON.parse(json);
        const next = {
          tournaments: parsed.tournaments || {},
          votes: parsed.votes || {},
          results: parsed.results || {},
        };
        return writeState(next);
      } catch (e) {
        console.error('[storage] 백업 복구 실패:', e);
        return false;
      }
    },

    // 전체 초기화 (토너먼트/투표/결과 모두 삭제)
    resetAll() {
      try {
        localStorage.removeItem(STORAGE_KEY);
        return true;
      } catch (e) {
        console.error('[storage] 초기화 실패:', e);
        return false;
      }
    },

    // 저장 용량 요약 (바이트)
    getStats() {
      const state = readState();
      const raw = localStorage.getItem(STORAGE_KEY) || '';
      return {
        tournamentCount: Object.keys(state.tournaments).length,
        completedCount: Object.keys(state.votes).length,
        bytes: new Blob([raw]).size,
      };
    },
  };

  /* ===========================================================
   * 📋 내장 템플릿 3종
   * - 교실에서 바로 쓸 수 있는 기본 주제

      items: [
        { emoji: '🍡', text: '떡볶이' },

        { emoji: '🍩', text: '도넛' },
        { emoji: '🌸', text: '마카롱' },
      ],
    },
    {
      key: 'class-rules',
      title: '학급 규칙 우선순위',
      size: 8,
      description: '우리 반에서 가장 중요한 규칙은?',
      items: [
        { emoji: '⏰', text: '수업 시간 지키기' },
        { emoji: '🤝', text: '친구 존중하기' },
        { emoji: '📝', text: '숙제 열심히 하기' },
        { emoji: '🧹', text: '정리정돈' },
        { emoji: '👋', text: '인사 잘하기' },
        { emoji: '🧼', text: '손 씻기' },
        { emoji: '🚶', text: '복도 걸어 다니기' },
        { emoji: '👂', text: '경청하기' },
      ],
    },
  ];

  /* ===========================================================
   * 🛣️ 해시 라우터
   * - #/ 홈 / #/create / #/play / #/result
   * - L1 Phase 1에서는 홈만 구현, 나머지는 "준비 중"
   * =========================================================== */
  const routes = {
    '/': renderHome,
    '/create': renderCreate,
    '/play': renderPlay,
    '/result': renderResult,
    '/settings': renderSettings,
  };

  // 해시 → { path, query }
  function parseHash() {
    const raw = location.hash.replace(/^#/, '') || '/';
    const [path, queryStr = ''] = raw.split('?');
    const query = {};
    new URLSearchParams(queryStr).forEach((v, k) => { query[k] = v; });
    return { path: path || '/', query };
  }

  // 라우터 실행
  function router() {
    const { path, query } = parseHash();
    const view = routes[path] || renderNotFound;
    const app = document.getElementById('app');
    app.innerHTML = '';
    app.classList.remove('dd-fade-in');
    // 리플로우 강제 후 재시작 (애니메이션 재실행용)
    void app.offsetWidth;
    app.classList.add('dd-fade-in');
    view(app, query);
  }

  // 네비게이션 헬퍼
  function navigate(path) {
    location.hash = path;
  }

  /* ===========================================================
   * 🏠 홈 화면 (#/)
   * =========================================================== */
  function renderHome(root) {
    const tournaments = storage.listMyTournaments();

    root.innerHTML = `
      <!-- 상단 로고 영역 -->
      <header class="relative text-center pt-6 pb-8">
        <button id="btnSettings" class="absolute top-4 right-0 dd-btn-ghost px-3 py-2 text-base" aria-label="설정">⚙️</button>
        <h1 class="text-4xl sm:text-5xl font-black dd-logo-badge mb-2">
          🏆 뚝딱밸런스
        </h1>
        <p class="text-sm sm:text-base" style="color: var(--dd-text-sub);">
          우리 반이 뽑는 최고의 선택
        </p>
      </header>

      <!-- 중앙 CTA -->
      <section class="mb-5">
        <button
          id="btnCreate"
          class="dd-btn-primary w-full py-5 text-lg sm:text-xl shadow-md"
          aria-label="새 토너먼트 만들기"
        >
          ✨ 새 토너먼트 만들기
        </button>
      </section>

      <!-- 📲 학생 초대 QR -->
      <section id="inviteQR" class="mb-8"></section>

      <!-- 내 토너먼트 목록 -->
      <section>
        <div class="flex items-center justify-between mb-3 px-1">
          <h2 class="text-base font-bold" style="color: var(--dd-text);">
            📚 내 토너먼트
          </h2>
          <span class="text-xs" style="color: var(--dd-text-sub);">
            총 ${tournaments.length}개
          </span>
        </div>

        <div id="tournamentList"></div>

    `;

    // CTA 바인딩 (터치/클릭 모두 처리)
    const btnCreate = root.querySelector('#btnCreate');
    btnCreate.addEventListener('click', () => navigate('/create'));
    root.querySelector('#btnSettings').addEventListener('click', () => navigate('/settings'));

    // 📲 학생 초대 QR 섹션
    renderHomeInviteQR(root.querySelector('#inviteQR'));

    // 목록 렌더
    const listEl = root.querySelector('#tournamentList');
    if (tournaments.length === 0) {
      listEl.innerHTML = `
        <div class="dd-empty p-10 text-center">
          <div class="text-4xl mb-3">🌱</div>
          <p class="text-sm">아직 만든 토너먼트가 없어요</p>
          <p class="text-xs mt-1" style="color: var(--dd-text-sub);">
            위 버튼으로 첫 주제를 만들어보세요!
          </p>
        </div>
      `;
    } else {
      listEl.innerHTML = tournaments.map((t) => {
        const done = !!storage.getVotes(t.id);
        return `
        <div class="dd-card p-4 mb-3 flex items-center justify-between gap-3">
          <div class="flex-1 min-w-0">
            <div class="font-bold truncate flex items-center gap-1" style="color: var(--dd-text);">
              ${done ? '🏆 ' : ''}${escapeHtml(t.title || '(제목 없음)')}
            </div>
            <div class="text-xs mt-1" style="color: var(--dd-text-sub);">
              ${(t.items || []).length}강 · ${formatDate(t.createdAt)}${done ? ' · 완료' : ''}
            </div>
          </div>
          <div class="flex gap-2 shrink-0">
            ${done ? `
              <button class="dd-btn-primary px-3 py-2 text-sm" data-action="result" data-id="${t.id}">
                결과
              </button>
            ` : `
              <button class="dd-btn-secondary px-3 py-2 text-sm" data-action="play" data-id="${t.id}">
                투표
              </button>
            `}
            <button class="dd-btn-ghost px-3 py-2 text-sm" data-action="delete" data-id="${t.id}" aria-label="삭제">
              🗑️
            </button>
          </div>
        </div>
      `;
      }).join('');

      // 이벤트 위임
      listEl.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const { action, id } = btn.dataset;
        if (action === 'play') {
          navigate(`/play?t=${encodeURIComponent(id)}`);
        } else if (action === 'result') {
          navigate(`/result?t=${encodeURIComponent(id)}`);
        } else if (action === 'delete') {
          if (confirm('이 토너먼트를 삭제할까요?')) {
            storage.deleteTournament(id);
            router(); // 재렌더
          }
        }
      });
    }
  }

  /* ===========================================================
   * ✨ 주제 생성 화면 (#/create)
   * - 탭 2종: 템플릿 / 커스텀
   * - 상태는 DOM에 종속 (간단 MVP, 탭 전환 시 입력 유지 안 함)
   * =========================================================== */
  function renderCreate(root) {
    // 현재 탭: 'template' | 'custom'
    let currentTab = 'template';
    // 커스텀 폼 임시 상태 (탭 재진입 시 보존)
    const customState = { title: '', size: 16, items: Array(16).fill(null).map(() => ({ emoji: '', text: '' })) };

    function renderShell() {
      root.innerHTML = `
        <header class="flex items-center gap-3 pt-4 pb-6">
          <button id="btnBack" class="dd-btn-ghost px-3 py-2 text-sm" aria-label="뒤로">←</button>
          <h1 class="text-xl sm:text-2xl font-black" style="color: var(--dd-text);">
            새 토너먼트 만들기
          </h1>
        </header>

        <!-- 탭 스위처 -->
        <div class="flex gap-2 mb-5 p-1 rounded-2xl" style="background: var(--dd-border);">
          <button data-tab="template" class="dd-tab flex-1 py-2 text-sm font-semibold rounded-xl">
            📋 템플릿
          </button>
          <button data-tab="custom" class="dd-tab flex-1 py-2 text-sm font-semibold rounded-xl">
            ✏️ 직접 만들기
          </button>
        </div>

        <section id="tabContent"></section>
      `;

      root.querySelector('#btnBack').addEventListener('click', () => navigate('/'));
      root.querySelectorAll('[data-tab]').forEach((btn) => {
        btn.addEventListener('click', () => {
          currentTab = btn.dataset.tab;
          renderTabs();
        });
      });

      renderTabs();
    }

    function renderTabs() {
      // 탭 스타일 갱신
      root.querySelectorAll('[data-tab]').forEach((btn) => {
        const active = btn.dataset.tab === currentTab;
        btn.style.background = active ? 'var(--dd-white)' : 'transparent';
        btn.style.color = active ? 'var(--dd-coral-deep)' : 'var(--dd-text-sub)';
        btn.style.boxShadow = active ? 'var(--dd-shadow)' : 'none';
      });

      const content = root.querySelector('#tabContent');
      content.innerHTML = '';
      if (currentTab === 'template') {
        renderTemplateList(content);
      } else {
        renderCustomForm(content);
      }
    }

    /* --- 템플릿 탭 --- */
    function renderTemplateList(container) {
      container.innerHTML = templates.map((tpl) => `
        <div class="dd-card p-4 mb-3">
          <div class="flex items-start justify-between gap-3 mb-3">
            <div class="flex-1 min-w-0">
              <div class="font-bold text-base" style="color: var(--dd-text);">
                ${escapeHtml(tpl.title)}
              </div>
              <div class="text-xs mt-1" style="color: var(--dd-text-sub);">
                ${tpl.size}강 · ${escapeHtml(tpl.description)}
              </div>
            </div>
            <button class="dd-btn-primary px-4 py-2 text-sm shrink-0" data-tpl="${tpl.key}">
              사용하기
            </button>
          </div>
          <div class="flex flex-wrap gap-1 pt-2" style="border-top: 1px dashed var(--dd-border);">
            ${tpl.items.slice(0, 8).map((it) => `
              <span class="text-xs px-2 py-1 rounded-full" style="background: var(--dd-bg); color: var(--dd-text-sub);">
                ${it.emoji} ${escapeHtml(it.text)}
              </span>
            `).join('')}
            ${tpl.items.length > 8 ? `<span class="text-xs px-2 py-1" style="color: var(--dd-text-sub);">+${tpl.items.length - 8}개 더</span>` : ''}
          </div>
        </div>
      `).join('');

      container.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-tpl]');
        if (!btn) return;
        const tpl = templates.find((t) => t.key === btn.dataset.tpl);
        if (!tpl) return;
        if (saveFromTemplate(tpl)) {
          navigate('/');
        }
      });
    }

    /* --- 커스텀 탭 --- */
    function renderCustomForm(container) {
      container.innerHTML = `
        <div class="dd-card p-4 mb-4">
          <label class="block text-sm font-semibold mb-2" style="color: var(--dd-text);">
            토너먼트 제목
          </label>
          <input
            id="inpTitle"
            type="text"
            maxlength="40"
            placeholder="예) 우리 반 최고의 체험학습"
            class="w-full px-3 py-3 rounded-xl outline-none"
            style="background: var(--dd-bg); border: 1px solid var(--dd-border); color: var(--dd-text);"
          />

          <label class="block text-sm font-semibold mt-4 mb-2" style="color: var(--dd-text);">
            라운드 크기
          </label>
          <div class="flex gap-2">
            <button data-size="8" class="dd-size-btn flex-1 py-2 rounded-xl text-sm font-semibold">8강</button>
            <button data-size="16" class="dd-size-btn flex-1 py-2 rounded-xl text-sm font-semibold">16강</button>
          </div>
        </div>

        <div class="mb-3 px-1 flex items-center justify-between">
          <h2 class="text-sm font-bold" style="color: var(--dd-text);">후보 입력</h2>
          <span class="text-xs" style="color: var(--dd-text-sub);">이모지는 선택, 이름은 필수</span>
        </div>

        <div id="itemsList" class="mb-4"></div>

        <button id="btnSaveCustom" class="dd-btn-primary w-full py-4 text-base">
          저장하고 돌아가기
        </button>
        <p id="formMsg" class="text-xs text-center mt-3 min-h-[16px]" style="color: var(--dd-coral-deep);"></p>
      `;

      const titleInput = container.querySelector('#inpTitle');
      titleInput.value = customState.title;
      titleInput.addEventListener('input', (e) => { customState.title = e.target.value; });

      container.querySelectorAll('[data-size]').forEach((btn) => {
        const size = Number(btn.dataset.size);
        const active = customState.size === size;
        btn.style.background = active ? 'var(--dd-coral)' : 'var(--dd-bg)';
        btn.style.color = active ? 'var(--dd-white)' : 'var(--dd-text-sub)';
        btn.style.border = active ? 'none' : '1px solid var(--dd-border)';
        btn.addEventListener('click', () => {
          if (customState.size === size) return;
          customState.size = size;
          // 기존 입력 보존하며 길이 조정
          if (size > customState.items.length) {
            while (customState.items.length < size) customState.items.push({ emoji: '', text: '' });
          } else {
            customState.items = customState.items.slice(0, size);
          }
          renderCustomForm(container);
        });
      });

      const itemsList = container.querySelector('#itemsList');
      itemsList.innerHTML = customState.items.map((it, idx) => `
        <div class="flex gap-2 mb-2 items-center">
          <span class="text-xs w-6 text-center shrink-0" style="color: var(--dd-text-sub);">${idx + 1}</span>
          <input
            type="text"
            data-field="emoji"
            data-idx="${idx}"
            maxlength="4"
            placeholder="🎯"
            value="${escapeHtml(it.emoji)}"
            class="w-14 px-2 py-2 rounded-xl text-center outline-none"
            style="background: var(--dd-white); border: 1px solid var(--dd-border);"
          />
          <input
            type="text"
            data-field="text"
            data-idx="${idx}"
            maxlength="20"
            placeholder="후보 이름"
            value="${escapeHtml(it.text)}"
            class="flex-1 px-3 py-2 rounded-xl outline-none"
            style="background: var(--dd-white); border: 1px solid var(--dd-border);"
          />
        </div>
      `).join('');

      itemsList.addEventListener('input', (e) => {
        const input = e.target.closest('input[data-idx]');
        if (!input) return;
        const idx = Number(input.dataset.idx);
        const field = input.dataset.field;
        customState.items[idx][field] = input.value;
      });

      container.querySelector('#btnSaveCustom').addEventListener('click', () => {
        const msgEl = container.querySelector('#formMsg');
        const err = validateCustom(customState);
        if (err) {
          msgEl.textContent = err;
          return;
        }
        if (saveFromCustom(customState)) {
          navigate('/');
        } else {
          msgEl.textContent = '저장에 실패했어요. 용량을 확인해주세요.';
        }
      });
    }

    renderShell();
  }

  /* ===========================================================
   * 💾 저장 헬퍼 (create 화면 전용)
   * =========================================================== */
  function newId() {
    return (crypto?.randomUUID?.() || 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8));
  }

  function saveFromTemplate(tpl) {
    const tournament = {
      id: newId(),
      title: tpl.title,
      type: 'template',
      templateKey: tpl.key,
      items: tpl.items.map((it, i) => ({ id: 'i' + i, emoji: it.emoji, text: it.text })),
      createdAt: Date.now(),
    };
    return storage.saveTournament(tournament);
  }

  function validateCustom(state) {
    const title = (state.title || '').trim();
    if (!title) return '제목을 입력해주세요.';
    if (title.length < 2) return '제목은 2자 이상이어야 해요.';
    const filled = state.items.filter((it) => (it.text || '').trim().length > 0);
    if (filled.length !== state.size) {
      return `${state.size}개 후보를 모두 입력해주세요. (현재 ${filled.length}개)`;
    }
    // 중복 텍스트 체크
    const names = filled.map((it) => it.text.trim());
    if (new Set(names).size !== names.length) return '중복된 후보 이름이 있어요.';
    return null;
  }

  function saveFromCustom(state) {
    const tournament = {
      id: newId(),
      title: state.title.trim(),
      type: 'custom',
      items: state.items.map((it, i) => ({
        id: 'i' + i,
        emoji: (it.emoji || '').trim() || '🎯',
        text: it.text.trim(),
      })),
      createdAt: Date.now(),
    };
    return storage.saveTournament(tournament);
  }

  /* ===========================================================
   * 🏟️ 투표 화면 (#/play?t={id})
   * - 토너먼트 items 셔플 → 라운드별 매치 생성 → 승자 누적
   * - 결승 완료 시 votes 저장 후 #/result 로 이동
   * =========================================================== */
  function renderPlay(root, query) {
    const tid = query?.t;
    const tournament = tid ? storage.getTournament(tid) : null;

    // 예외 케이스 처리
    if (!tournament) {
      renderPlayError(root, '토너먼트를 찾을 수 없어요', '링크가 잘못되었거나 삭제된 토너먼트일 수 있어요.');
      return;
    }
    const items = tournament.items || [];
    if (items.length < 2 || (items.length & (items.length - 1)) !== 0) {
      renderPlayError(root, '후보 개수가 맞지 않아요', '토너먼트는 2, 4, 8, 16개 단위여야 해요.');
      return;
    }

    // 진행 상태 (세션 휘발)
    const state = {
      rounds: [],           // 완료된 라운드들 [{ size, matches:[{a,b,winner}] }]
      currentMatches: buildMatches(shuffle([...items])),
      currentIdx: 0,
      winners: [],
      locked: false,
    };

    render();

    function render() {
      const match = state.currentMatches[state.currentIdx];
      if (!match) return; // 안전 장치 (전이 중)
      const totalMatches = state.currentMatches.length;
      const size = totalMatches * 2;
      const progress = Math.round((state.currentIdx / totalMatches) * 100);

      root.innerHTML = `
        <header class="flex items-center gap-3 pt-4 pb-2">
          <button id="btnBack" class="dd-btn-ghost px-3 py-2 text-sm" aria-label="홈으로">←</button>
          <div class="flex-1 min-w-0">
            <div class="text-xs truncate" style="color: var(--dd-text-sub);">
              ${escapeHtml(tournament.title)}
            </div>
            <div class="text-lg font-black" style="color: var(--dd-text);">
              ${roundLabel(size)} <span style="color: var(--dd-coral-deep);">${state.currentIdx + 1}/${totalMatches}</span>
            </div>
          </div>
        </header>

        <div class="dd-progress-track mb-6">
          <div class="dd-progress-fill" style="width: ${progress}%;"></div>
        </div>

        <div id="matchArea" class="dd-round-enter">
          <button class="dd-vs-card" data-pick="a" aria-label="${escapeHtml(match.a.text)} 선택">
            <div class="dd-vs-emoji">${match.a.emoji || '🎯'}</div>
            <div class="dd-vs-text">${escapeHtml(match.a.text)}</div>
          </button>

          <div class="flex justify-center my-3">
            <span class="dd-vs-badge">VS</span>
          </div>

          <button class="dd-vs-card" data-pick="b" aria-label="${escapeHtml(match.b.text)} 선택">
            <div class="dd-vs-emoji">${match.b.emoji || '🎯'}</div>
            <div class="dd-vs-text">${escapeHtml(match.b.text)}</div>
          </button>
        </div>

        <p class="text-center text-xs mt-6" style="color: var(--dd-text-sub);">
          마음에 드는 쪽을 탭하세요
        </p>
      `;

      root.querySelector('#btnBack').addEventListener('click', () => {
        if (confirm('홈으로 돌아가면 진행 중인 투표가 사라져요. 계속할까요?')) {
          navigate('/');
        }
      });

      const cards = root.querySelectorAll('.dd-vs-card');
      cards.forEach((card) => {
        card.addEventListener('click', () => pick(card.dataset.pick));
      });
    }

    function pick(side) {
      if (state.locked) return;
      state.locked = true;

      const match = state.currentMatches[state.currentIdx];
      match.winner = side;
      const winner = side === 'a' ? match.a : match.b;
      state.winners.push(winner);

      // 선택 애니메이션 (GPU: transform/opacity)
      const pickedEl = root.querySelector(`.dd-vs-card[data-pick="${side}"]`);
      const lostEl = root.querySelector(`.dd-vs-card[data-pick="${side === 'a' ? 'b' : 'a'}"]`);
      pickedEl?.classList.add('is-picked');
      lostEl?.classList.add('is-lost');

      setTimeout(() => {
        state.currentIdx += 1;
        if (state.currentIdx >= state.currentMatches.length) {
          finishRound();
        } else {
          state.locked = false;
          render();
        }
      }, 550);
    }

    function finishRound() {
      const size = state.currentMatches.length * 2;
      state.rounds.push({
        size,
        matches: state.currentMatches.map((m) => ({ a: m.a, b: m.b, winner: m.winner })),
      });

      if (state.winners.length === 1) {
        // 챔피언 확정
        const champion = state.winners[0];
        storage.saveVotes(tournament.id, {
          rounds: state.rounds,
          champion,
          completedAt: Date.now(),
        });
        navigate(`/result?t=${encodeURIComponent(tournament.id)}`);
        return;
      }

      // 다음 라운드 준비 (이전 승자 순서 유지, 셔플 X — 대진 추적 용이)
      state.currentMatches = buildMatches(state.winners);
      state.winners = [];
      state.currentIdx = 0;
      state.locked = false;
      render();
    }
  }

  function renderPlayError(root, title, message) {
    root.innerHTML = `
      <header class="text-center pt-10 pb-6">
        <h1 class="text-2xl font-black dd-logo-badge mb-2">${escapeHtml(title)}</h1>
        <p class="text-sm" style="color: var(--dd-text-sub);">${escapeHtml(message)}</p>
      </header>
      <div class="dd-empty p-10 text-center mb-6">
        <div class="text-4xl mb-2">🙈</div>
      </div>
      <button id="btnHome" class="dd-btn-primary w-full py-3">홈으로 가기</button>
    `;
    root.querySelector('#btnHome').addEventListener('click', () => navigate('/'));
  }

  /* 🎲 배열 셔플 (Fisher-Yates) */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* 짝수 배열 → 매치 쌍 */
  function buildMatches(items) {
    const matches = [];
    for (let i = 0; i < items.length; i += 2) {
      matches.push({ a: items[i], b: items[i + 1], winner: null });
    }
    return matches;
  }

  /* 라운드 라벨 */
  function roundLabel(size) {
    if (size === 2) return '결승';
    if (size === 4) return '4강';
    if (size === 8) return '8강';
    if (size === 16) return '16강';
    if (size === 32) return '32강';
    return size + '강';
  }

  /* ===========================================================
   * 🏆 결과 화면 (#/result?t={id})
   * - 챔피언 카드 + 우승 경로 + 라운드별 대진표
   * =========================================================== */
  function renderResult(root, query) {
    const tid = query?.t;
    const tournament = tid ? storage.getTournament(tid) : null;
    const votes = tid ? storage.getVotes(tid) : null;

    if (!tournament) {
      renderPlayError(root, '결과를 찾을 수 없어요', '링크가 잘못되었거나 삭제된 토너먼트일 수 있어요.');
      return;
    }
    if (!votes || !votes.champion) {
      root.innerHTML = `
        <header class="text-center pt-8 pb-4">
          <h1 class="text-2xl font-black dd-logo-badge mb-2">아직 투표를 안 했어요</h1>
          <p class="text-sm" style="color: var(--dd-text-sub);">먼저 토너먼트를 진행해주세요.</p>
        </header>
        <div class="flex flex-col gap-2">

  /* 📸 결과 이미지 저장 — 오프스크린 카드 렌더 후 html2canvas 캡처 */
  async function saveResultImage(tournament, votes, flash) {
    if (typeof html2canvas !== 'function') {
      flash('⏳ 이미지 라이브러리 로딩 중... 잠시 후 다시 시도해주세요');
      return;
    }
    flash('📸 이미지 만드는 중...');
    const card = buildShareCard(tournament, votes);
    document.body.appendChild(card);
    try {
      const canvas = await html2canvas(card, {
        backgroundColor: '#FFF8F0',
        scale: 2,
        useCORS: true,
        logging: false,
      });
      canvas.toBlob((blob) => {
        if (!blob) { flash('❌ 이미지 생성 실패'); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const safe = (tournament.title || 'dduktak').replace(/[^\p{L}\p{N}\-_]/gu, '_').slice(0, 20);
        a.href = url;
        a.download = `ddalkak-${safe}-${Date.now()}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        flash('✅ 이미지 저장 완료!');
      }, 'image/png');
    } catch (e) {
      console.error(e);
      flash('❌ 이미지 생성 실패');
    } finally {
      document.body.removeChild(card);
    }
  }

  /* 챔피언의 라운드별 대진 상대 추출 */
  function getChampionPath(rounds, champion) {
    const path = [];
    rounds.forEach((round) => {
      round.matches.forEach((m) => {
        const winner = m.winner === 'a' ? m.a : m.b;
        const loser = m.winner === 'a' ? m.b : m.a;
        if (winner && winner.id === champion.id) {
          path.push({ size: round.size, opponent: loser });
        }
      });
    });
    return path;
  }

  }

  /* ===========================================================
   * 🧩 플레이스홀더 화면 (Phase 5+에서 사용 가능)
   * =========================================================== */
  function renderPlaceholder(title, message) {
    return function (root) {
      root.innerHTML = `
        <header class="text-center pt-6 pb-8">
          <h1 class="text-3xl font-black dd-logo-badge mb-2">${title}</h1>
          <p class="text-sm" style="color: var(--dd-text-sub);">${message}</p>
        </header>
        <div class="dd-empty p-10 text-center">
          <div class="text-4xl mb-3">🚧</div>
          <p class="text-sm">준비 중</p>
        </div>
        <div class="mt-6 text-center">
          <button id="btnHome" class="dd-btn-ghost px-5 py-3">← 홈으로</button>
        </div>
      `;
      root.querySelector('#btnHome').addEventListener('click', () => navigate('/'));
    };
  }

  function renderNotFound(root) {
    root.innerHTML = `
      <header class="text-center pt-10">
        <h1 class="text-3xl font-black dd-logo-badge mb-2">🤔 페이지를 찾을 수 없어요</h1>
        <p class="text-sm" style="color: var(--dd-text-sub);">잘못된 경로입니다.</p>
      </header>
      <div class="mt-8 text-center">
        <button id="btnHome" class="dd-btn-primary px-6 py-3">홈으로 가기</button>
      </div>
    `;
    root.querySelector('#btnHome').addEventListener('click', () => navigate('/'));
  }

  /* ===========================================================
   * 🛠️ 유틸
   * =========================================================== */
  function escapeHtml(str) {
    return String(str)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function formatDate(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}.${m}.${day}`;
  }

  /* ===========================================================
   * 🚀 부트스트랩
   * =========================================================== */
  window.addEventListener('hashchange', router);
  window.addEventListener('DOMContentLoaded', () => {
    if (!location.hash) location.hash = '/';
    router();
  });

  // 개발 편의: 콘솔에서 storage 접근 (배포 시 제거 고려)
  window.__ddalkak = { storage };
</script>
